<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NutriTrack{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header class="navbar">
    <a class="brand" href="{% url 'dashboard' %}">Nutri<span>Track</span></a>
    <nav>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'progress_list' %}">Progress</a>
        <a href="{% url 'blog_list' %}">Blogs</a>
        <a class="nav-btn" href="{% url 'progress_create' %}">+ Add Progress</a>
    </nav>
</header>

<main class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>

<footer>
    <p>NutriTrack • Progress Tracking & Blogs</p>
</footer>
</body>
</html>
