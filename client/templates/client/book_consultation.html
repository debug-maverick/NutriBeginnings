{% extends 'client/base.html' %}

{% block title %}Book Consultation - NutriBeginnings{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="text-center text-success mb-4">Book Your Consultation</h1>
            <p class="text-center mb-4">Schedule a one-on-one session with our expert nutritionists. Start your journey to better health today!</p>
            
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your full name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" placeholder="Enter your phone number" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Preferred Date</label>
                            <input type="date" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Preferred Time</label>
                            <select class="form-control" required>
                                <option value="">Select a time</option>
                                <option value="09:00">9:00 AM</option>
                                <option value="10:00">10:00 AM</option>
                                <option value="11:00">11:00 AM</option>
                                <option value="13:00">1:00 PM</option>
                                <option value="14:00">2:00 PM</option>
                                <option value="15:00">3:00 PM</option>
                                <option value="16:00">4:00 PM</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Health Goals</label>
                            <textarea class="form-control" rows="4" placeholder="What are your health goals? Any specific concerns?" required></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 btn-lg">
                            <i class="fas fa-calendar-check me-2"></i>Schedule Consultation
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
